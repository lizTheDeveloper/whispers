version: "3.9"

services:
  web:
    build: .
    # image is deliberately pinned (rather than left to compose's
    # project-name default) so deploy.sh can retag "latest" as "rollback"
    # before building a new one, and can point compose at "rollback" by
    # setting WHISPERS_IMAGE_TAG without rebuilding.
    image: whispers-server:${WHISPERS_IMAGE_TAG:-latest}
    container_name: whispers-server
    restart: unless-stopped
    environment:
      LLM_PROXY_URL: http://llm-token-proxy:4242
      PORT: "3000"
      # DATA_DIR is static content baked into the image (scenarios/,
      # dm-presets/, systems/) — never mount a volume over this path, it
      # would shadow that content.
      DATA_DIR: /app/data
      # STATE_DIR is the live database's own home, on the volume below, so
      # it survives `docker compose up --build` recreating the container.
      STATE_DIR: /app/state
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
    volumes:
      - whispers_state:/app/state
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.whispers-play.rule=Host(`play.multiversestudios.xyz`) && PathPrefix(`/whispers`)
      - traefik.http.routers.whispers-play.entrypoints=https
      - traefik.http.routers.whispers-play.tls.certresolver=letsencrypt
      - traefik.http.routers.whispers-play.priority=200
      - traefik.http.routers.whispers-play.middlewares=whispers-strip
      - traefik.http.middlewares.whispers-strip.stripprefix.prefixes=/whispers
      - traefik.http.routers.whispers-play-http.rule=Host(`play.multiversestudios.xyz`) && PathPrefix(`/whispers`)
      - traefik.http.routers.whispers-play-http.entrypoints=http
      - traefik.http.routers.whispers-play-http.middlewares=whispers-redirect
      - traefik.http.middlewares.whispers-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.whispers-redirect.redirectscheme.permanent=true
      - traefik.http.services.whispers.loadbalancer.server.port=3000

networks:
  coolify:
    external: true

volumes:
  # Named explicitly (rather than left to compose's project-name-prefixed
  # default) so deploy.sh and any manual `docker volume`/`docker cp` calls
  # can address it by a fixed name regardless of which directory or
  # COMPOSE_PROJECT_NAME this file is invoked from.
  whispers_state:
    name: whispers_state
