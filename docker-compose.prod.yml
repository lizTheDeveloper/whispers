version: "3.9"

services:
  web:
    build: .
    # image is deliberately pinned (rather than left to compose's
    # project-name default) so deploy.sh can retag "latest" as "rollback"
    # before building a new one, and can point compose at "rollback" by
    # setting WHISPERS_IMAGE_TAG without rebuilding.
    image: whispers-server:${WHISPERS_IMAGE_TAG:-latest}
    container_name: whispers-server
    restart: unless-stopped
    environment:
      LLM_PROXY_URL: http://llm-token-proxy:4242
      PORT: "3000"
      # DATA_DIR is static content baked into the image (scenarios/,
      # dm-presets/, systems/) — never mount a volume over this path, it
      # would shadow that content.
      DATA_DIR: /app/data
      # STATE_DIR is the live database's own home, on the volume below, so
      # it survives `docker compose up --build` recreating the container.
      STATE_DIR: /app/state
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      # Child-safety evidence vault (Raising Intelligences' ingest, over the
      # Docker network). The token lives in /opt/whispers/.env (untracked)
      # and in VaultWarden as "child-safety ingest token". Without it flags
      # are kept in the outbox and delivered once it is set.
      CHILD_SAFETY_INGEST_URL: http://raising-intelligences:3000/api/internal/child-safety/evidence
      CHILD_SAFETY_INGEST_TOKEN: ${CHILD_SAFETY_INGEST_TOKEN:-}
      # Dead-lettered evidence (a permanent refusal from the vault) alerts this
      # Matrix room. Token and room in /opt/whispers/.env (VaultWarden: the
      # ops alert bot). Never carries content.
      MATRIX_ALERT_TOKEN: ${MATRIX_ALERT_TOKEN:-}
      MATRIX_ALERT_ROOM: ${MATRIX_ALERT_ROOM:-}
      # Only Traefik may set X-Forwarded-For: its fixed address on llm-relay
      # (it has no forwardedHeaders.trustedIPs, so it overwrites any
      # client-sent header). Nothing on the shared coolify bridge is trusted.
      TRUSTED_PROXIES: 172.30.42.3/32
    volumes:
      - whispers_state:/app/state
    # Two networks on purpose, like feedback-api and the LLM relay. Traefik
    # reaches us over llm-relay, where it has the static IP 172.30.42.3 that
    # TRUSTED_PROXIES trusts (its coolify IP is dynamic, and any coolify
    # container could otherwise forge a client IP). coolify stays for the
    # LLM proxy and the child-safety ingest (raising-intelligences).
    networks:
      coolify: {}
      llm-relay:
        ipv4_address: 172.30.42.12
    labels:
      - traefik.enable=true
      - traefik.docker.network=llm-relay
      - traefik.http.routers.whispers-play.rule=Host(`play.multiversestudios.xyz`) && PathPrefix(`/whispers`)
      - traefik.http.routers.whispers-play.entrypoints=https
      - traefik.http.routers.whispers-play.tls.certresolver=letsencrypt
      - traefik.http.routers.whispers-play.priority=200
      - traefik.http.routers.whispers-play.middlewares=whispers-strip
      - traefik.http.middlewares.whispers-strip.stripprefix.prefixes=/whispers
      - traefik.http.routers.whispers-play-http.rule=Host(`play.multiversestudios.xyz`) && PathPrefix(`/whispers`)
      - traefik.http.routers.whispers-play-http.entrypoints=http
      - traefik.http.routers.whispers-play-http.middlewares=whispers-redirect
      - traefik.http.middlewares.whispers-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.whispers-redirect.redirectscheme.permanent=true
      # play.multiversegames.ai — every portal/homepage link uses this domain.
      # Without these routers, /whispers on .ai fell through to Precursors'
      # speech-to-text websocket (PathPrefix /whisper also matches /whispers)
      # and players got "426: You cannot access a WebSocket server directly".
      # priority=200 beats that shorter-rule router, same as on .xyz.
      - traefik.http.routers.whispers-play-ai.rule=Host(`play.multiversegames.ai`) && PathPrefix(`/whispers`)
      - traefik.http.routers.whispers-play-ai.entrypoints=https
      - traefik.http.routers.whispers-play-ai.tls.certresolver=letsencrypt
      - traefik.http.routers.whispers-play-ai.priority=200
      - traefik.http.routers.whispers-play-ai.middlewares=whispers-strip
      - traefik.http.routers.whispers-play-ai.service=whispers
      - traefik.http.routers.whispers-play-ai-http.rule=Host(`play.multiversegames.ai`) && PathPrefix(`/whispers`)
      - traefik.http.routers.whispers-play-ai-http.entrypoints=http
      - traefik.http.routers.whispers-play-ai-http.middlewares=whispers-redirect
      - traefik.http.routers.whispers-play-ai-http.service=whispers
      - traefik.http.services.whispers.loadbalancer.server.port=3000

networks:
  coolify:
    external: true
  # docker network create --subnet 172.30.42.0/24 llm-relay
  # docker network connect --ip 172.30.42.3 llm-relay traefik   # redo if Traefik is recreated
  llm-relay:
    external: true

volumes:
  # Named explicitly (rather than left to compose's project-name-prefixed
  # default) so deploy.sh and any manual `docker volume`/`docker cp` calls
  # can address it by a fixed name regardless of which directory or
  # COMPOSE_PROJECT_NAME this file is invoked from.
  whispers_state:
    name: whispers_state
